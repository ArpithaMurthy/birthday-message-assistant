name: Prepare Launch Posts

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Draft set to prepare"
        type: choice
        default: all
        options:
          - all
          - x
          - reddit_sideproject
          - reddit_productivity
          - indiehackers

permissions:
  contents: read
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate launch drafts
        run: python scripts/launch_agent.py --channel "${{ inputs.channel }}" --markdown launch_outbox/launch_drafts.md
      - uses: actions/upload-artifact@v4
        with:
          name: tinytools-launch-drafts
          path: launch_outbox/
      - name: Create launch checklist issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('launch_outbox/launch_drafts.md', 'utf8');
            const { data: issue } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `TinyTools launch drafts - ${new Date().toISOString().slice(0, 10)}`,
              body
            });
            core.summary.addRaw(`Created issue: ${issue.html_url}`).write();
